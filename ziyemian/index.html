    async function startBatchUpdate() {
        if (state.running) return;

        if (window.location.protocol === 'file:') {
            log('当前页面通过 file:// 打开，仍将使用内置云函数地址。', 'warn');
        }

        const auth = state.auth ? {
            token: String(state.auth.token || '').trim(),
            providerId: normalizeProviderId(state.auth.providerId),
            account: state.auth.account || ''
        } : null;

        if (!auth || !auth.token || auth.providerId === '') {
            log('请先完成登录（扫码登录或缓存登录）。', 'err');
            return;
        }

        const relayUrl = getRelayUrl();
        if (!relayUrl) {
            log('云函数地址为空，请先在设置中填写云函数Url。', 'err');
            return;
        }

        if (!(els.idsEnable && els.idsEnable.checked)) {
            log('请先启用活动ID。', 'err');
            return;
        }

        const parsed = parseIds(els.idsInput.value || '');
        if (parsed.invalid.length > 0) {
            log(`活动ID格式错误：${parsed.invalid.slice(0, 8).join(', ')}${parsed.invalid.length > 8 ? ' ...' : ''}`, 'err');
            return;
        }
        if (parsed.ids.length === 0) {
            log('请先输入活动ID。', 'err');
            return;
        }

        let targetConfig;
        try {
            targetConfig = readTargetConfigFromUi();
        } catch (error) {
            log(`限购参数校验失败：${error.message}`, 'err');
            return;
        }
        let areaConfig;
        try {
            areaConfig = readAreaTargetConfigFromUi();
        } catch (error) {
            log(`定向管理参数校验失败：${error.message}`, 'err');
            return;
        }
        let timeConfig;
        try {
            timeConfig = readActivityTimeTargetConfigFromUi();
        } catch (error) {
            log(`活动期间参数校验失败：${error.message}`, 'err');
            return;
        }
        let operationConfig;
        try {
            operationConfig = readOperationTargetConfigFromUi();
        } catch (error) {
            log(`运营策略参数校验失败：${error.message}`, 'err');
            return;
        }
        let statusConfig;
        try {
            statusConfig = readActivityStatusTargetConfigFromUi();
        } catch (error) {
            log(`活动状态参数校验失败：${error.message}`, 'err');
            return;
        }
        if (
            !(targetConfig && targetConfig.enabled)
            && !(areaConfig && areaConfig.enabled)
            && !(timeConfig && timeConfig.enabled)
            && !(operationConfig && operationConfig.enabled)
            && !(statusConfig && statusConfig.enabled)
        ) {
            log('请至少启用一个修改项：限购参数、定向管理、活动期间、运营策略、活动状态。', 'err');
            return;
        }

        state.runId += 1;
        const thisRun = state.runId;
        state.stopRequested = false;

        setAuth({
            token: auth.token,
            providerId: auth.providerId,
            account: auth.account || (state.auth ? state.auth.account : '')
        }, true);

        setRunningUi(true);
        setSummary(`处理中：0/${parsed.ids.length}`);
        const concurrency = getConcurrency();
        log(`任务开始：共 ${parsed.ids.length} 个活动ID，并发数 ${concurrency}。`);
        log(`限购参数目标：${ruleTargetText(targetConfig)}`);
        log(`定向管理目标：${areaTargetText(areaConfig)}`);
        log(`活动期间目标：${activityTimeTargetText(timeConfig)}`);
        log(`运营策略目标：${operationTargetText(operationConfig)}`);
        log(`活动状态目标：${activityStatusTargetText(statusConfig)}`);

        const stats = {
            total: parsed.ids.length,
            done: 0,
            updated: 0,
            already: 0,
            notFound: 0,
            unverified: 0,
            failed: 0,
            updatedIds: [],
            alreadyIds: [],
            notFoundIds: [],
            unverifiedIds: [],
            failedIds: [],
            failedDetails: []
        };

        try {
            await runPool(parsed.ids, concurrency, async function (id, idx) {
                if (state.stopRequested || state.runId !== thisRun) return;
                log(`(${idx + 1}/${parsed.ids.length}) 开始处理活动ID=${id}`);

                try {
                    const result = await processOneActivity(state.auth, id, targetConfig, areaConfig, timeConfig, operationConfig, statusConfig);
                    if (result.status === 'updated') {
                        stats.updated += 1;
                        stats.updatedIds.push(id);
                        const detailParts = [];
                        if (result.applied && result.applied.limit) {
                            detailParts.push(`限购参数 [${ruleText(result.before)}] -> [${ruleText(result.after)}]`);
                        }
                        if (result.applied && result.applied.area) {
                            detailParts.push(`定向管理 [${areaText(result.beforeArea)}] -> [${areaText(result.afterArea)}]`);
                        }
                        if (result.applied && result.applied.activityTime) {
                            detailParts.push(`活动期间 [${activityTimeText(result.beforeTime)}] -> [${activityTimeText(result.afterTime)}]`);
                        }
                        if (result.applied && result.applied.operation) {
                            detailParts.push(`运营策略 [${operationText(result.beforeOperation)}] -> [${operationText(result.afterOperation)}]`);
                        }
                        if (result.applied && result.applied.activityStatus) {
                            detailParts.push(`活动状态 [${activityStatusText(result.beforeStatus)}] -> [${activityStatusText(result.afterStatus)}]`);
                        }
                        log(`活动ID=${id} 修改成功：${detailParts.join('；')}`, 'ok');
                    } else if (result.status === 'already_target') {
                        stats.already += 1;
                        stats.alreadyIds.push(id);
                        log(
                            `活动ID=${id} 已是目标值：限购参数[${ruleText(result.before)}]，定向管理[${areaText(result.beforeArea)}]，活动期间[${activityTimeText(result.beforeTime)}]，运营策略[${operationText(result.beforeOperation)}]，活动状态[${activityStatusText(result.beforeStatus)}]`,
                            'warn'
                        );
                    } else if (result.status === 'not_found') {
                        stats.notFound += 1;
                        stats.notFoundIds.push(id);
                        log(`活动ID=${id} 未找到。`, 'warn');
                    } else if (result.status === 'unverified') {
                        stats.unverified += 1;
                        stats.unverifiedIds.push(id);
                        log(
                            `活动ID=${id} 已提交但复核失败：限购参数提交后[${ruleText(result.after)}]，定向管理提交后[${areaText(result.afterArea)}]，活动期间提交后[${activityTimeText(result.afterTime)}]，运营策略提交后[${operationText(result.afterOperation)}]，活动状态提交后[${activityStatusText(result.afterStatus)}]`,
                            'warn'
                        );
                    } else {
                        stats.failed += 1;
                        stats.failedIds.push(id);
                        stats.failedDetails.push({ id: id, error: result.error || '未知错误' });
                        log(`活动ID=${id} 修改失败：${result.error || '未知错误'}`, 'err');
                    }
                } catch (error) {
                    stats.failed += 1;
                    stats.failedIds.push(id);
                    stats.failedDetails.push({ id: id, error: error.message });
                    log(`活动ID=${id} 执行异常：${error.message}`, 'err');
                } finally {
                    stats.done += 1;
                    setSummary(
                        `处理中 ${stats.done}/${stats.total}；成功 ${stats.updated}；已是目标 ${stats.already}；未找到 ${stats.notFound}；复核失败 ${stats.unverified}；失败 ${stats.failed}`
                    );
                }
            });
        } finally {
            setRunningUi(false);
        }

        if (state.stopRequested) {
            log('任务已按用户请求停止。', 'warn');
            logBatchResultSummary(stats, '任务中止汇总');
            setSummary(`已停止：${stats.done}/${stats.total}`);
            return;
        }

        logBatchResultSummary(stats, '任务完成汇总');
        setSummary(`已完成：总数 ${stats.total}；成功 ${stats.updated}；失败 ${stats.failed}`);
    }

    const PmsLoginModule = {
        config: {
            apiBase: LOGIN_PROXY_URL,
            pollInterval: 1000,
            qrcodeTimeout: 300000
        },
        state: {
            currentStep: 'init',
            webKey: null,
            lastStatus: 'QRCODE_SCAN_NEVER',
            openDataSid: null,
            pollingTimer: null,
            qrcodeTimer: null,
            authCode: null,
            credentials: null,
            userInfo: null,
            permissions: null
        },
        init: function () {
            this.resetState();
        },
        resetState: function () {
            this.state = {
                currentStep: 'init',
                webKey: null,
                lastStatus: 'QRCODE_SCAN_NEVER',
                openDataSid: null,
                pollingTimer: null,
                qrcodeTimer: null,
                authCode: null,
                credentials: null,
                userInfo: null,
                permissions: null
            };
        },
        apiRequest: async function (params) {
            const query = new URLSearchParams(params || {}).toString();
            const url = `${this.config.apiBase}?${query}`;
            return fetchJson(url, { method: 'GET', timeoutMs: 20000 });
        },
        getQrcode: async function () {
            const data = await this.apiRequest({ action: 'get_qrcode' });
            if (String(data.code) !== SUCCESS_CODE) throw new Error(data.message || '获取二维码失败');
            return data;
        },
        checkStatus: async function (webKey, lastStatus, openDataSid) {
            const params = { action: 'check_status', web_key: webKey };
            if (lastStatus) params.last_status = lastStatus;
            if (openDataSid) params.open_data_sid = openDataSid;
            const data = await this.apiRequest(params);
            if (String(data.code) !== SUCCESS_CODE) throw new Error(data.message || '轮询扫码状态失败');
            return data;
        },
        login: async function (authCode) {
            const data = await this.apiRequest({ action: 'login', auth_code: authCode });
            if (String(data.code) !== SUCCESS_CODE) throw new Error(data.message || '登录失败');
            return data;
        },
        startLogin: async function () {
            this.state.currentStep = 'qrcode';
            const qrcodeResult = await this.getQrcode();
            this.state.webKey = qrcodeResult.data.web_key;
            this.state.qrcodeTimer = setTimeout(() => {
                if (this.state.currentStep === 'qrcode' || this.state.currentStep === 'polling') {
                    this.stopPolling();
                    this.state.currentStep = 'expired';
                }
            }, this.config.qrcodeTimeout);
            return {
                step: 'qrcode',
                qrcodeUrl: qrcodeResult.data.qrcode_url,
                message: '请使用企微扫码'
            };
        },
        startPolling: async function () {
            if (!this.state.webKey) throw new Error('二维码未初始化');
            this.state.currentStep = 'polling';
            return new Promise((resolve, reject) => {
                const poll = async () => {
                    try {
                        if (this.state.currentStep === 'expired') {
                            reject(new Error('二维码已过期，请刷新重试'));
                            return;
                        }
                        const statusResult = await this.checkStatus(this.state.webKey, this.state.lastStatus, this.state.openDataSid);
                        const statusData = statusResult.data || {};
                        this.state.lastStatus = statusData.status;
                        if (statusData.open_data_sid) this.state.openDataSid = statusData.open_data_sid;

                        switch (statusData.status) {
                            case 'QRCODE_SCAN_NEVER':
                            case 'QRCODE_SCAN_ING':
                                this.state.pollingTimer = setTimeout(poll, this.config.pollInterval);
                                break;
                            case 'QRCODE_SCAN_SUCC':
                                this.state.authCode = statusData.auth_code;
                                this.stopPolling();
                                await this.finalizeLogin();
                                resolve({ step: 'success', message: '登录成功' });
                                break;
                            case 'QRCODE_SCAN_ERR':
                            case 'QRCODE_SCAN_TIMEOUT':
                            case 'QRCODE_SCAN_CANCEL':
                                this.stopPolling();
                                reject(new Error('二维码已失效，请刷新重试'));
                                break;
                            default:
                                this.state.pollingTimer = setTimeout(poll, this.config.pollInterval);
                                break;
                        }
                    } catch (error) {
                        this.stopPolling();
                        reject(error);
                    }
                };
                poll();
            });
        },
        stopPolling: function () {
            if (this.state.pollingTimer) {
                clearTimeout(this.state.pollingTimer);
                this.state.pollingTimer = null;
            }
            if (this.state.qrcodeTimer) {
                clearTimeout(this.state.qrcodeTimer);
                this.state.qrcodeTimer = null;
            }
        },
        finalizeLogin: async function () {
            const loginResult = await this.login(this.state.authCode);
            const loginData = loginResult.data || {};
            this.state.credentials = loginData.credentials || {};
            if (loginData.provider_id) this.state.credentials.providerId = loginData.provider_id;
            this.state.userInfo = loginData.user || null;
            this.state.permissions = loginData.permissions || null;
            this.state.currentStep = 'success';
        },
        getState: function () {
            return { ...this.state };
        },
        restart: function () {
            this.stopPolling();
            this.resetState();
        }
    };

    const LoginDialog = {
        state: {
            overlay: null,
            container: null,
            main: null,
            isOpen: false,
            statusTimer: null,
            onSuccess: null
        },
        init: function () {
            if (this.state.overlay) return;
            const overlay = document.createElement('div');
            overlay.className = 'login-overlay';
            overlay.style.display = 'none';

            const container = document.createElement('div');
            container.className = 'login-container';

            const closeBtn = document.createElement('button');
            closeBtn.className = 'login-close';
            closeBtn.textContent = 'x';
            closeBtn.addEventListener('click', () => this.close());

            const main = document.createElement('div');
            main.className = 'login-main';

            container.appendChild(closeBtn);
            container.appendChild(main);
            overlay.appendChild(container);
            document.body.appendChild(overlay);

            this.state.overlay = overlay;
            this.state.container = container;
            this.state.main = main;
        },
        open: function (onSuccess) {
            this.init();
            this.state.onSuccess = onSuccess;
            this.state.isOpen = true;
            this.state.overlay.style.display = 'flex';
            setTimeout(() => {
                this.state.overlay.classList.add('active');
                this.state.container.classList.add('active');
            }, 10);

            PmsLoginModule.init();
            this.renderPmsQrcodeView();
        },
        close: function () {
            if (!this.state.isOpen) return;
            this.state.isOpen = false;
            this.clearStatusTimer();
            PmsLoginModule.stopPolling();
            this.state.overlay.classList.remove('active');
            this.state.container.classList.remove('active');
            setTimeout(() => {
                this.state.overlay.style.display = 'none';
            }, 300);
        },
        clearStatusTimer: function () {
            if (this.state.statusTimer) {
                clearTimeout(this.state.statusTimer);
                this.state.statusTimer = null;
            }
        },
        renderPmsQrcodeView: function () {
            this.state.main.innerHTML = '';
            const header = document.createElement('div');
            header.className = 'login-header';
            header.innerHTML = '<h3>PMS系统登录</h3>';

            const body = document.createElement('div');
            body.className = 'login-body';
            body.innerHTML = `
                <div class="qrcode-container">
                    <div class="qrcode-image" id="pms-qrcode-image" style="position: relative;">
                        <div class="qrcode-loading">
                            <div class="spinner"></div>
                            <span>正在生成二维码...</span>
                        </div>
                    </div>
                </div>
            `;

            const footer = document.createElement('div');
            footer.className = 'login-footer';
            footer.innerHTML = '<button id="pms-login-btn" class="login-btn primary" disabled>等待二维码...</button>';

            this.state.main.appendChild(header);
            this.state.main.appendChild(body);
            this.state.main.appendChild(footer);

            const qrcodeImage = body.querySelector('#pms-qrcode-image');
            qrcodeImage.addEventListener('click', () => this.refreshPmsQrcode());

            this.loadPmsQrcode();
        },
        loadPmsQrcode: async function () {
            const qrcodeImage = this.state.main.querySelector('#pms-qrcode-image');
            const loginBtn = this.state.main.querySelector('#pms-login-btn');
            if (!qrcodeImage || !loginBtn) return;
            try {
                const result = await PmsLoginModule.startLogin();
                qrcodeImage.innerHTML = `
                    <img src="${result.qrcodeUrl}" alt="wecom qrcode" id="pms-qrcode-img">
                    <div class="qrcode-overlay" id="pms-qrcode-overlay" style="display:none;">OK</div>
                `;
                loginBtn.disabled = true;
                loginBtn.textContent = '等待扫码...';
                this.startPmsPolling();
            } catch (error) {
                qrcodeImage.innerHTML = `
                    <div class="qrcode-error">
                        <div style="font-size:32px;">!</div>
                        <p>${error.message}</p>
                    </div>
                `;
                loginBtn.disabled = false;
                loginBtn.textContent = '重试';
                loginBtn.onclick = () => this.refreshPmsQrcode();
            }
        },
        refreshPmsQrcode: async function () {
            const qrcodeImage = this.state.main.querySelector('#pms-qrcode-image');
            const loginBtn = this.state.main.querySelector('#pms-login-btn');
            if (!qrcodeImage || !loginBtn) return;
            try {
                qrcodeImage.innerHTML = `
                    <div class="qrcode-loading">
                        <div class="spinner"></div>
                        <span>刷新中...</span>
                    </div>
                `;
                loginBtn.disabled = true;
                loginBtn.textContent = '刷新中...';
                PmsLoginModule.restart();
                const result = await PmsLoginModule.startLogin();
                qrcodeImage.innerHTML = `
                    <img src="${result.qrcodeUrl}" alt="wecom qrcode" id="pms-qrcode-img">
                    <div class="qrcode-overlay" id="pms-qrcode-overlay" style="display:none;">OK</div>
                `;
                loginBtn.disabled = true;
                loginBtn.textContent = '等待扫码...';
                this.startPmsPolling();
            } catch (error) {
                qrcodeImage.innerHTML = `
                    <div class="qrcode-error">
                        <div style="font-size:32px;">!</div>
                        <p>${error.message}</p>
                    </div>
                `;
                loginBtn.disabled = false;
                loginBtn.textContent = '重试';
            }
        },
        startPmsPolling: function () {
            const overlay = this.state.main.querySelector('#pms-qrcode-overlay');
            const loginBtn = this.state.main.querySelector('#pms-login-btn');
            if (!overlay || !loginBtn) return;

            PmsLoginModule.startPolling().then(() => {
                this.showSuccess();
            }).catch((error) => {
                overlay.style.display = 'none';
                loginBtn.disabled = false;
                loginBtn.textContent = '重试';
                log(`扫码登录轮询失败：${error.message}`, 'err');
            });

            const checkStatus = () => {
                if (!this.state.isOpen) return;
                const s = PmsLoginModule.getState();
                if (s.currentStep === 'polling') {
                    if (s.lastStatus === 'QRCODE_SCAN_ING') {
                        overlay.style.display = 'flex';
                        loginBtn.disabled = true;
                        loginBtn.textContent = '扫码成功，请确认...';
                    } else if (s.lastStatus === 'QRCODE_SCAN_SUCC') {
                        overlay.style.display = 'flex';
                        loginBtn.disabled = true;
                        loginBtn.textContent = '登录中...';
                    } else {
                        overlay.style.display = 'none';
                        loginBtn.disabled = true;
                        loginBtn.textContent = '等待扫码...';
                    }
                    this.state.statusTimer = setTimeout(checkStatus, 300);
                }
            };
            checkStatus();
        },
        showSuccess: function () {
            const s = PmsLoginModule.getState();
            const token = s.credentials ? (s.credentials.pms_token || s.credentials.token || '') : '';
            const providerId = s.credentials ? (s.credentials.providerId || s.credentials.provider_id || '') : '';
            const account = s.userInfo && s.userInfo.account ? s.userInfo.account : '';

            this.state.main.innerHTML = `
                <div class="login-header"><h3>PMS系统登录</h3></div>
                <div class="login-body">
                    <div class="success-container">
                        <div class="success-icon">OK</div>
                        <div class="success-message">
                            <h4>登录成功！</h4>
                            <p>即将返回页面...</p>
                        </div>
                    </div>
                </div>
                <div class="login-footer"><button class="login-btn primary" disabled>登录</button></div>
            `;

            if (token && providerId !== '' && providerId !== null && providerId !== undefined) {
                const auth = {
                    token: String(token),
                    providerId: normalizeProviderId(providerId),
                    account: account || ''
                };
                if (typeof this.state.onSuccess === 'function') {
                    this.state.onSuccess(auth);
                }
            } else {
                log('登录成功但未拿到完整鉴权信息(token/providerId)，请重新扫码。', 'warn');
            }

            setTimeout(() => this.close(), 1500);
        }
    };

    function renderLoadingList(listEl) {
        if (!listEl) return;
        bringAutocompleteToFront(listEl);
        listEl.innerHTML = '';
        const li = document.createElement('li');
        li.className = 'autocomplete-empty';
        li.textContent = '加载中...';
        listEl.appendChild(li);
        listEl.classList.add('show');
    }

    function resetRestrictSelection() {
        if (!els.restrictKeyword) return;
        els.restrictKeyword.value = '';
        clearSelectedOption(els.restrictKeyword);
        closeAutocompleteList(els.restrictKeywordList);
    }

    function updateRestrictUi(options) {
        const opts = options || {};
        const mode = getRestrictModeFromUi();
        const clear = !!opts.clearSelection;

        if (els.restrictWrap) els.restrictWrap.style.display = '';
        if (mode === 0) {
            if (els.restrictLabel) {
                els.restrictLabel.textContent = '控销/禁销组';
            }
            if (els.restrictKeyword) {
                els.restrictKeyword.placeholder = '选择控销或禁销后可输入';
            }
            if (clear || !state.running) {
                resetRestrictSelection();
            }
            return;
        }

        if (els.restrictLabel) {
            els.restrictLabel.textContent = mode === 1 ? '控销组' : '禁销组';
        }
        if (els.restrictKeyword) {
            els.restrictKeyword.placeholder = mode === 1
                ? '输入关键字搜索控销组，如：华、马应龙、控销'
                : '输入关键字搜索禁销组，如：SP、禁销';
        }
        if (clear) {
            resetRestrictSelection();
        }
    }

    function setConfigCardState(cardEl, enabled) {
        if (!cardEl) return;
        cardEl.classList.toggle('is-disabled', !enabled);
    }

    function applyRuleConfigEnabledUi() {
        const enabled = !!(els.ruleEnable && els.ruleEnable.checked);
        setConfigCardState(els.ruleConfigBox, enabled);
        setRunningUi(state.running);
    }

    function applyIdsConfigEnabledUi() {
        const enabled = !!(els.idsEnable && els.idsEnable.checked);
        setConfigCardState(els.idsConfigBox, enabled);
        setRunningUi(state.running);
    }

    function applyAreaConfigEnabledUi() {
        const enabled = !!(els.areaEnable && els.areaEnable.checked);
        setConfigCardState(els.areaConfigBox, enabled);

        if (!enabled) {
            state.restrictModeTouched = false;
            closeAllAutocompleteLists();
        }
        updateRestrictUi({ clearSelection: false });
        setRunningUi(state.running);
    }

    function applyActivityTimeConfigEnabledUi() {
        const enabled = !!(els.activityTimeEnable && els.activityTimeEnable.checked);
        setConfigCardState(els.activityTimeConfigBox, enabled);
        setRunningUi(state.running);
    }

    function applyOperationConfigEnabledUi() {
        const enabled = !!(els.operationEnable && els.operationEnable.checked);
        setConfigCardState(els.operationConfigBox, enabled);
        setRunningUi(state.running);
    }

    function applyActivityStatusConfigEnabledUi() {
        const enabled = !!(els.activityStatusEnable && els.activityStatusEnable.checked);
        setConfigCardState(els.activityStatusConfigBox, enabled);
        setRunningUi(state.running);
    }

    function bindEnumAutocomplete(inputEl, listEl, type) {
        if (!inputEl || !listEl) return;
        let debounceTimer = null;
        let localRequestSeq = 0;

        async function doSearch() {
            if (!(els.areaEnable && els.areaEnable.checked)) {
                closeAutocompleteList(listEl);
                return;
            }

            const auth = state.auth;
            if (!auth || !auth.token || auth.providerId === '' || auth.providerId === null || auth.providerId === undefined) {
                renderAutocompleteList(listEl, [], function () {}, '请先登录后搜索候选列表。');
                return;
            }

            if (type === ENUM_TYPE_RESTRICT && getRestrictModeFromUi() === 0) {
                closeAutocompleteList(listEl);
                return;
            }

            const keyword = String(inputEl.value || '').trim();
            const requestSeq = ++state.enumRequestSeq;
            localRequestSeq = requestSeq;
            bringAutocompleteToFront(listEl);
            renderLoadingList(listEl);

            try {
                const items = await fetchEnumOptions(auth, type, keyword, 100);
                if (localRequestSeq !== state.enumRequestSeq) return;
                renderAutocompleteList(listEl, items, function (item) {
                    setSelectedOption(inputEl, item);
                    closeAutocompleteList(listEl);
                }, '未找到候选项。');
            } catch (error) {
                if (localRequestSeq !== state.enumRequestSeq) return;
                renderAutocompleteList(listEl, [], function () {}, `查询失败：${error.message}`);
            }
        }

        inputEl.addEventListener('input', function () {
            const current = String(inputEl.value || '').trim();
            const selectedName = String(inputEl.dataset.selectedName || '').trim();
            if (current !== selectedName) {
                clearSelectedOption(inputEl);
            }
            if (debounceTimer) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function () {
                doSearch().catch(function () {});
            }, 260);
        });

        inputEl.addEventListener('focus', function () {
            bringAutocompleteToFront(listEl);
            doSearch().catch(function () {});
        });

        inputEl.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeAutocompleteList(listEl);
            }
        });
    }

    function bindDateTimeSelectOnly(inputEl) {
        if (!inputEl) return;
        inputEl.addEventListener('keydown', function (event) {
            if (event.key === 'Tab') return;
            event.preventDefault();
        });
        inputEl.addEventListener('paste', function (event) {
            event.preventDefault();
        });
        inputEl.addEventListener('drop', function (event) {
            event.preventDefault();
        });
    }

    function bindDateTimeAutoOpen(inputEl) {
        if (!inputEl) return;

        function tryOpenPicker() {
            if (state.running) return;
            if (!(els.activityTimeEnable && els.activityTimeEnable.checked)) return;
            if (inputEl.disabled) return;
            if (typeof inputEl.showPicker !== 'function') return;
            try {
                inputEl.showPicker();
            } catch (_) {}
        }

        inputEl.addEventListener('click', tryOpenPicker);
        inputEl.addEventListener('focus', tryOpenPicker);
    }

    function bindEvents() {
        bindEnumAutocomplete(els.areaKeyword, els.areaKeywordList, ENUM_TYPE_AREA);
        bindEnumAutocomplete(els.supplyKeyword, els.supplyKeywordList, ENUM_TYPE_SUPPLY);
        bindEnumAutocomplete(els.restrictKeyword, els.restrictKeywordList, ENUM_TYPE_RESTRICT);
        bindDateTimeSelectOnly(els.activityTimeStart);
        bindDateTimeSelectOnly(els.activityTimeEnd);
        bindDateTimeAutoOpen(els.activityTimeStart);
        bindDateTimeAutoOpen(els.activityTimeEnd);

        document.addEventListener('click', function (event) {
            if (event.target && event.target.closest && event.target.closest('.autocomplete')) return;
            closeAllAutocompleteLists();
        });

        if (els.ruleEnable) {
            els.ruleEnable.addEventListener('change', function () {
                applyRuleConfigEnabledUi();
            });
        }

        if (els.idsEnable) {
            els.idsEnable.addEventListener('change', function () {
                applyIdsConfigEnabledUi();
            });
        }

        if (els.areaEnable) {
            els.areaEnable.addEventListener('change', function () {
                applyAreaConfigEnabledUi();
            });
        }

        if (els.activityTimeEnable) {
            els.activityTimeEnable.addEventListener('change', function () {
                applyActivityTimeConfigEnabledUi();
            });
        }

        if (els.operationEnable) {
            els.operationEnable.addEventListener('change', function () {
                applyOperationConfigEnabledUi();
            });
        }

        if (els.activityStatusEnable) {
            els.activityStatusEnable.addEventListener('change', function () {
                applyActivityStatusConfigEnabledUi();
            });
        }

        document.querySelectorAll('input[name="restrict-mode"]').forEach(function (radio) {
            radio.addEventListener('click', function () {
                state.restrictModeTouched = true;
            });
            radio.addEventListener('change', function () {
                state.restrictModeTouched = true;
                updateRestrictUi({ clearSelection: true });
                setRunningUi(state.running);
            });
        });

        els.btnLogin.addEventListener('click', () => {
            LoginDialog.open((auth) => {
                setAuth(auth, true);
                log(`登录成功：providerId=${auth.providerId}${auth.account ? `，账号=${auth.account}` : ''}`, 'ok');
            });
        });

        els.btnStart.addEventListener('click', () => {
            if (state.running) {
                if (state.stopRequested) return;
                state.stopRequested = true;
                els.btnStart.textContent = '执行修改';
                els.btnStart.classList.remove('warn');
                els.btnStart.classList.add('primary');
                els.btnStart.disabled = true;
                log('已请求停止，正在等待进行中的请求结束...', 'warn');
                return;
            }

            startBatchUpdate().catch((error) => {
                setRunningUi(false);
                log(`任务异常终止：${error.message}`, 'err');
                setSummary('任务异常');
            });
        });

        if (els.btnSettings) {
            els.btnSettings.addEventListener('click', function () {
                openSettingsDialog();
            });
        }
        if (els.settingsCancel) {
            els.settingsCancel.addEventListener('click', function () {
                closeSettingsDialog();
            });
        }
        if (els.settingsSave) {
            els.settingsSave.addEventListener('click', function () {
                try {
                    saveSettingsFromDialog();
                } catch (error) {
                    log(`设置保存失败：${error.message}`, 'err');
                }
            });
        }
    }

    function init() {
        loadSettings();
        bindEvents();
        fillSettingsForm();
        loadAuth();
        applyIdsConfigEnabledUi();
        applyRuleConfigEnabledUi();
        applyAreaConfigEnabledUi();
        applyActivityTimeConfigEnabledUi();
        applyOperationConfigEnabledUi();
        applyActivityStatusConfigEnabledUi();
        setSummary('');
        log('页面已就绪，请先扫码登录或使用缓存登录。');
        log(`当前云函数地址：${getRelayUrl()}`, 'ok');
        log(`当前并发设置：${getConcurrency()}`, 'ok');
    }

    init();
})();

</script>
</body>
